name: Mivehchin APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name for the release (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
  push:
    branches:
      - "arena/**"
    paths:
      - "game-android/**"
      - ".github/workflows/mivehchin-release.yml"
    tags:
      - "miveh-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Make sure SDK platform 34 is present
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Unit tests
        working-directory: game-android
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee ../test.log

      - name: Compile
        working-directory: game-android
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease --stacktrace 2>&1 | tee ../build.log

      - name: Sign the APK
        id: sign
        run: |
          set -o pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#miveh-v}"
            if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
              VERSION="0.0.0-${GITHUB_SHA:0:7}"
            fi
          fi
          VERSION="$(printf '%s' "$VERSION" | tr '/ ' '--')"
          echo "version=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ( cd game-android && bash tools/sign-apk.sh "$VERSION" ) 2>&1 | tee sign.log

      - name: Publish the failure log back to the branch
        if: failure()
        run: |
          set +e
          : > ci-build-errors.log
          for f in build.log sign.log test.log game-android/build.log game-android/sign.log; do
            if [ -f "$f" ]; then
              echo "=== $f ===" >> ci-build-errors.log
              grep -E "^(e: |FAILURE|\* What went wrong|Caused by|Execution failed|> |== |!! )" "$f" | head -300 >> ci-build-errors.log
              tail -c 6000 "$f" >> ci-build-errors.log
            fi
          done
          echo "=== apk outputs ===" >> ci-build-errors.log
          find game-android/app/build/outputs -name '*.apk' -printf '%p %s\n' 2>/dev/null >> ci-build-errors.log
          [ -s ci-build-errors.log ] || echo "no log captured" > ci-build-errors.log
          git config user.name "mivehchin-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-build-errors.log
          git commit -m "ci: capture compiler output [skip ci]" || exit 0
          git push origin "HEAD:${{ github.ref_name }}" || exit 0

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mivehchin-apk
          path: Mivehchin-*.apk
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/miveh-v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: miveh-v${{ steps.sign.outputs.version }}
          name: میوه‌چین ${{ steps.sign.outputs.version }}
          body_path: game-android/RELEASE_NOTES.md
          files: Mivehchin-${{ steps.sign.outputs.version }}.apk
          draft: false
          prerelease: false
          make_latest: true
