name: Mivehchin APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name for the release (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
  push:
    branches:
      - "arena/**"
    paths:
      - "game-android/**"
      - ".github/workflows/mivehchin-release.yml"
    tags:
      - "miveh-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Make sure SDK platform 34 is present
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          if [ ! -d "$SDK/platforms/android-34" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Compile
        working-directory: game-android
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease --stacktrace 2>&1 | tee ../ci-build.log

      - name: Publish the build log back to the branch when compilation fails
        if: failure()
        run: |
          set +e
          LOG=ci-build.log
          [ -f "$LOG" ] || echo "no log captured" > "$LOG"
          # keep only material an outside reader can act on
          grep -E "^(e: |w: |FAILURE|\* What went wrong|Caused by|[0-9]+ actionable|Execution failed|> )" "$LOG" | head -400 > ci-build-errors.log
          [ -s ci-build-errors.log ] || tail -c 20000 "$LOG" > ci-build-errors.log
          git config user.name "mivehchin-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -f ci-build-errors.log
          git commit -m "ci: capture compiler output [skip ci]" || exit 0
          git push origin "HEAD:${{ github.ref_name }}" || exit 0

      - name: Sign the APK
        id: sign
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BT"
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#miveh-v}"
          fi
          echo "version: $VERSION"
          UNSIGNED="game-android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED" ]; then
            echo "unsigned apk not found, listing outputs:"
            find game-android/app/build/outputs -name "*.apk" -print
            exit 1
          fi
          keytool -genkeypair -v -keystore miveh.jks -alias miveh \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mivehchin -keypass mivehchin \
            -dname "CN=Mivehchin, O=Mivehchin, C=IR"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "Mivehchin-$VERSION.apk"
          "$BT/apksigner" sign --ks miveh.jks --ks-pass pass:mivehchin \
            --key-pass pass:mivehchin --out "Mivehchin-$VERSION.apk.tmp" "Mivehchin-$VERSION.apk"
          mv "Mivehchin-$VERSION.apk.tmp" "Mivehchin-$VERSION.apk"
          "$BT/apksigner" verify --print-certs "Mivehchin-$VERSION.apk"
          ls -l Mivehchin-*.apk
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mivehchin-apk
          path: Mivehchin-*.apk
          retention-days: 14

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/miveh-v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: miveh-v${{ steps.sign.outputs.version }}
          name: میوه‌چین ${{ steps.sign.outputs.version }}
          body_path: game-android/RELEASE_NOTES.md
          files: Mivehchin-${{ steps.sign.outputs.version }}.apk
          draft: false
          prerelease: false
          make_latest: true
